---
- name: Ensure all nodes are in Ready state
  when: inventory_hostname == first_master_node
  block:
    - name: Get all node status
      raw: "{{ bin_dir }}/kubectl get nodes --no-headers"
      register: all_nodes_status

    - name: Get all node status different than Ready
      raw: echo "{{ all_nodes_status.stdout }}" | grep -v ' Ready'
      register: nodes_status

    - name: Show not ready nodes
      debug: msg="{{ nodes_status.stdout_lines }}"
      when: nodes_status.stdout != "\r\n"

    - name: Confirm Reconfigure
      pause:
        prompt: "Some workers are not in Ready state. Type 'yes' to continue with reconfigure"
      register: pause_result
      when: nodes_status.stdout != "\r\n"

    - name: Fail if user does not confirm reconfigure
      fail:
        msg: "Reconfigure control pĺane will not continue"
      when: pause_result.user_input | default('yes') != 'yes'

- name: Check API is up
  uri:
    url: "https://{{ ip | default(fallback_ips[inventory_hostname]) }}:{{ kube_apiserver_port }}/healthz"
    validate_certs: false
  when: inventory_hostname == first_master_node
  register: _result
  retries: 60
  delay: 5
  until: _result.status == 200

- name: Check if kubeadm has already run
  stat:
    path: "/var/lib/kubelet/config.yaml"
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: kubeadm_already_run

- name: Set reconfig path
  set_fact:
    kube_reconfig_path: "{{ kube_reconfig_dir }}/cm-clusterconfig-{{ now(utc=true, fmt='%Y%m%d-%H%M%S') }}.yaml"

- name: Backup Kubernetes configuration files
  archive:
    path: "{{ kube_config_dir }}"
    dest: "{{ kube_config_dir }}/kubernetes-config-{{ ansible_date_time.date }}.tar.gz"
    format: gz

- name: Create backup directory if it doesn't exist
  file:
    path: "{{ kube_reconfig_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Backup ConfigMap
  when: inventory_hostname == first_master_node
  raw: "{{ bin_dir }}/kubectl get cm -n {{ cm_namespace }} {{ cm_name }} -o yaml > {{ kube_reconfig_path }}"
  become: true
  register: cm_backup
  failed_when: cm_backup.rc != 0

- name: Delete ConfigMap
  when: inventory_hostname == first_master_node and cm_backup.rc == 0
  raw: "{{ bin_dir }}/kubectl delete cm -n {{ cm_namespace }} {{ cm_name }}"
  become: true
  register: cm_delete
  failed_when: cm_delete.rc != 0

- name: Create reconfigure kubeadm config
  template:
    src: "cluster-configuration-replace.yaml.j2"
    dest: "{{ kube_reconfig_path }}"
    mode: "0640"

- name: Create new configmap for ClusterConfiguration
  raw: "{{ bin_dir }}/kubectl create configmap -n {{ cm_namespace }} {{ cm_name }} --from-file=ClusterConfiguration={{ kube_reconfig_path }}"
  when: inventory_hostname == first_master_node

- name: Reconfigure control-plane
  when: kubeadm_already_run.stat.exists
  block:
    - name: Prepare ClusterConfiguration manifest
      lineinfile:
        path: "{{ kube_reconfig_path }}"
        line: "{{ item }}"
        create: yes
      loop:
        - "apiVersion: kubeadm.k8s.io/v1beta3"
        - "kind: ClusterConfiguration"

    - name: Write new manifest for kubernetes control plane components
      raw: "kubeadm init phase control-plane all --config {{ kube_reconfig_path }}"

    - name: Reconfigure local etcd
      raw: "kubeadm init phase etcd local --config {{ kube_reconfig_path }}"

    - name: Delete kube-apiserver pod
      raw: "{{ bin_dir }}/kubectl delete pod -n kube-system kube-apiserver-{{ ansible_hostname }}"
      ignore_errors: true

    - name: Wait for kube-apiserver pod to be running
      raw: "{{ bin_dir }}/kubectl get pod -n kube-system kube-apiserver-{{ ansible_hostname }} -o jsonpath='{.status.phase}'"
      register: check_apiserver
      retries: 10
      delay: 30
      until: check_apiserver.stdout == 'Running'

    - name: Delete kube-controller-manager pod
      raw: "{{ bin_dir }}/kubectl delete pod -n kube-system kube-controller-manager-{{ ansible_hostname }}"
      ignore_errors: true

    - name: Wait for kube-controller-manager pod to be running
      raw: "{{ bin_dir }}/kubectl get pod -n kube-system kube-controller-manager-{{ ansible_hostname }} -o jsonpath='{.status.phase}'"
      register: check_controller_manager
      retries: 10
      delay: 30
      until: check_controller_manager.stdout == 'Running'

    - name: Delete kube-scheduler pod
      raw: "{{ bin_dir }}/kubectl delete pod -n kube-system kube-scheduler-{{ ansible_hostname }}"
      ignore_errors: true

    - name: Wait for kube-scheduler pod to be running
      raw: "{{ bin_dir }}/kubectl get pod -n kube-system kube-scheduler-{{ ansible_hostname }} -o jsonpath='{.status.phase}'"
      register: check_scheduler
      retries: 10
      delay: 30
      until: check_scheduler.stdout == 'Running'
